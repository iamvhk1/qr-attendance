# Supabase PostgreSQL Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================================
#   SECRETS — no fallback defaults in production
# ============================================================
# The defaults in application.properties are committed to the repo, so they must
# never be used in production. With no default here, the app refuses to start
# unless JWT_SECRET and ADMIN_SECRET are set in the environment.
app.jwt.secret=${JWT_SECRET}
app.admin.secret=${ADMIN_SECRET}

# ============================================================
#   H2 CONSOLE — disabled in production
# ============================================================
# H2 is still on the classpath (per-session heartbeat stores use it),
# but the web console must never be reachable on the deployed server.
spring.h2.console.enabled=false

# Keep other properties from application.properties or override them as needed
