# ============================================================
#   DATA SOURCE — H2 file mode (persists across restarts)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/qr-attendance-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
#   JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#   JWT CONFIGURATION
# ============================================================
# HMAC-SHA256 secret key (≥256 bits). CHANGE THIS IN PRODUCTION.
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItcXItYXR0ZW5kYW5jZS1zeXN0ZW0tMjAyNi1jaGFuZ2UtaW4tcHJvZA==}
# Login token validity: 24 hours (in milliseconds)
app.jwt.login-expiration-ms=86400000
# Scan token validity: 15 seconds (in milliseconds)
app.jwt.scan-expiration-ms=15000
# Scan token validity in congestion mode: 20 seconds
app.jwt.scan-congestion-expiration-ms=20000

# ============================================================
#   SERVER
# ============================================================
server.port=8080

# ============================================================
#   PRESENCE VERIFICATION (Heartbeat Anti-Cheat)
# ============================================================
# Heartbeat interval the frontend should use (in milliseconds)
app.presence.heartbeat-interval-ms=5000
# Minimum heartbeat coverage required to confirm attendance (0.0 - 1.0)
app.presence.min-coverage=0.80
# Grace period: consecutive missed heartbeats before counting as a gap
app.presence.grace-period-ms=15000

# ============================================================
#   QR SESSION
# ============================================================
# Default session window duration in seconds (how long the professor's session stays open)
app.session.default-duration-seconds=120
# Maximum concurrent active/live sessions a single professor can run simultaneously
app.session.max-concurrent-per-professor=${MAX_CONCURRENT_SESSIONS_PER_PROFESSOR:1}
# Storage directory for session-specific database files
app.session.db-storage-path=${SESSION_DB_PATH:./data/sessions}
# Frontend base URL — used to build the scan URL embedded inside each QR code PNG.
# Override this in application-prod.properties with the real Vercel URL.
app.frontend.url=${FRONTEND_URL:http://192.168.0.193:5173}

# ============================================================
#   REGISTRATION — email verification (OTP)
# ============================================================
# Only these email domains (and their subdomains) may register, comma-separated.
app.registration.allowed-domains=${REGISTRATION_ALLOWED_DOMAINS:iitm.ac.in}
# These domains (and subdomains) are refused even if they match the list above.
app.registration.blocked-domains=${REGISTRATION_BLOCKED_DOMAINS:smail.iitm.ac.in}
# Verification code lifetime, resend cooldown, and limits
app.otp.ttl-seconds=600
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5
app.otp.max-attempts=5
# Max verification emails per 24 h across all addresses (Brevo free tier: 300/day)
app.otp.daily-limit=${OTP_DAILY_LIMIT:250}

# ============================================================
#   EMAIL
# ============================================================
# "log" prints emails (including verification codes) to the console instead of sending
# them — the local-development default. Production uses "brevo".
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from-name=QR Attendance
app.mail.from-address=${MAIL_FROM:}
app.mail.brevo.api-key=${BREVO_API_KEY:}

# ============================================================
#   DEMO ACCOUNT (optional) — see DemoAccountInitializer
# ============================================================
# Set both to create/update a demo login on startup (any non-IITM email).
# Keep the email but clear the password to lock the account again.
app.demo.email=${DEMO_ACCOUNT_EMAIL:}
app.demo.password=${DEMO_ACCOUNT_PASSWORD:}
app.demo.full-name=${DEMO_ACCOUNT_NAME:Demo Professor}
