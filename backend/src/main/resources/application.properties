# ============================================================
#   DATA SOURCE — H2 file mode (persists across restarts)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/qr-attendance-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
#   JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#   JWT CONFIGURATION
# ============================================================
# HMAC-SHA256 secret key (≥256 bits). CHANGE THIS IN PRODUCTION.
app.jwt.secret=c3VwZXItc2VjcmV0LWtleS1mb3ItcXItYXR0ZW5kYW5jZS1zeXN0ZW0tMjAyNi1jaGFuZ2UtaW4tcHJvZA==
# Login token validity: 24 hours (in milliseconds)
app.jwt.login-expiration-ms=86400000
# Scan token validity: 15 seconds (in milliseconds)
app.jwt.scan-expiration-ms=15000
# Scan token validity in congestion mode: 20 seconds
app.jwt.scan-congestion-expiration-ms=20000
# Invite token validity: 48 hours (in milliseconds)
app.jwt.invite-expiration-ms=172800000

# ============================================================
#   SERVER
# ============================================================
server.port=8080

# ============================================================
#   PRESENCE VERIFICATION (Heartbeat Anti-Cheat)
# ============================================================
# Heartbeat interval the frontend should use (in milliseconds)
app.presence.heartbeat-interval-ms=5000
# Minimum heartbeat coverage required to confirm attendance (0.0 - 1.0)
app.presence.min-coverage=0.80
# Grace period: consecutive missed heartbeats before counting as a gap
app.presence.grace-period-ms=15000

# ============================================================
#   QR SESSION
# ============================================================
# Default session window duration in seconds (how long the professor's session stays open)
app.session.default-duration-seconds=120
# Frontend base URL — used to build the scan URL embedded inside each QR code PNG.
# Override this in application-prod.properties with the real Vercel URL.
app.frontend.url=http://192.168.0.193:5173

# ============================================================
#   ADMIN
# ============================================================
# Secret key required to generate invite codes (protects the admin endpoint)
app.admin.secret=changeme-admin-secret-2026
